<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Personal Portfolio</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Outfit',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
    background:
    radial-gradient(circle at top left,#00c6ff55 0%,transparent 35%),
    radial-gradient(circle at bottom right,#ff00cc55 0%,transparent 35%),
    linear-gradient(135deg,#0f172a,#111827,#1e1b4b);
    background-attachment:fixed;
}


.container{
    width:100%;
    max-width:900px;
    padding:40px 30px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(16px);
    box-shadow:0 20px 45px rgba(0,0,0,0.28);
    animation:fadeUp 1s ease;
}

h1{
    text-align:center;
    font-size:36px;
    margin-bottom:10px;
    font-weight:700;
}

.sub-text{
    text-align:center;
    color:#dbeafe;
    margin-bottom:35px;
    font-size:16px;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
    margin-bottom:30px;
}

.card{
    padding:22px;
    border-radius:20px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s ease;
}

.card:hover{
    transform:translateY(-8px);
    background:rgba(255,255,255,0.12);
    box-shadow:0 15px 30px rgba(0,0,0,0.20);
}

.card i{
    font-size:28px;
    margin-bottom:15px;
    color:#38bdf8;
}

.card h3{
    font-size:18px;
    margin-bottom:8px;
}

.card p{
    color:#dbeafe;
    line-height:1.6;
    font-size:15px;
}

/* Buttons */
.actions{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    color:#fff;
    transition:0.3s ease;
    box-shadow:0 10px 20px rgba(0,0,0,0.18);
}

.home{
    background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.mail{
    background:linear-gradient(135deg,#ec4899,#f43f5e);
}

.btn:hover{
    transform:translateY(-5px);
    opacity:0.95;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

.container{
    padding:28px 18px;
}

h1{
    font-size:28px;
}

.sub-text{
    font-size:14px;
}

.btn{
    width:100%;
    text-align:center;
}
.btn {
  display: inline-block;
  padding: 10px 16px;
  background: #28a745;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-size: 14px;
  transition: all 0.3s ease;
  animation: pulse 2s infinite;
}

.btn i {
  margin-right: 6px;
}

.btn:hover {
  background: #218838;
  transform: translateY(-3px) scale(1.05);
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.6);
  }
  70% {
    box-shadow: 0 0 0 10px rgba(40, 167, 69, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(40, 167, 69, 0);
  }
}

}

</style>
</head>

<body>

<div class="container">

<h1>📞 Contact Me</h1>
<p class="sub-text">Feel free to connect with me anytime.</p>

<div class="contact-grid">

<div class="card">
<i class="fa-solid fa-envelope"></i>
<h3>Email</h3>
<p>jeet191006@gmail.com</p>
</div>

<div class="card">
<i class="fa-solid fa-phone"></i>
<h3>Phone</h3>
<p>+91 7276557978</p>
</div>

<div class="card">
<i class="fa-solid fa-location-dot"></i>
<h3>Location</h3>
<p>Vasco-da-Gama, South Goa 403802, India</p>
</div>

</div>

<div class="actions">
<a href="index.html" class="btn home">
<i class="fa-solid fa-house"></i> Home
</a>

<a href="mailto:jeet191006@gmail.com" class="btn mail">
<i class="fa-solid fa-paper-plane"></i> Send Mail
</a>

<a href="callto:7276557978" class="btn mail ">
<i class="fa-solid fa-phone"></i> Call Me
</a>
</div>

</div>

</body>
</html>
